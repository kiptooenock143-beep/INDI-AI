name: Build INDI AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the web app
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Create the Android project
        working-directory: apk
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Add microphone permission
        working-directory: apk
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          cat "$M"

      - name: Generate app icons
        working-directory: apk
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#020617' --iconBackgroundColorDark '#020617'

      - name: Build debug APK
        working-directory: apk/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: INDI-AI-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
